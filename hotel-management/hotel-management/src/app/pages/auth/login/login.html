<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2>Hotel Management</h2>
        </div>

        <div class="error-msg" *ngIf="errorMessage" style="color: #ff4d4d; text-align: center; margin-bottom: 15px; font-size: 0.9rem;">
            {{ errorMessage }}
        </div>

        <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="input-group">
                <input type="text" name="username" [(ngModel)]="user.username" required placeholder=" "/>
                <label>Username</label>
            </div>
            
            <div class="input-group">
                <input type="password" name="password" [(ngModel)]="user.password" required placeholder=" "/>
                <label>Password</label>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>
</div>
